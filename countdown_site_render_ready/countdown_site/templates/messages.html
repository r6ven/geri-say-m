<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="message-csrf" content="{{ csrf_token }}"><title>Bizim mesajlarımız</title><link rel="stylesheet" href="/static/css/messages.css"><script src="/static/js/messages.js" defer></script></head>
<body><main><header><a href="/">← Siteye dön</a><span>{{ identity.name }}</span></header><h1>Birbirimize bıraktıklarımız</h1><p class="hint">Mesajlar yalnızca ikinizin tanıtılmış cihazlarında görünür.</p><p id="messageStatus" role="status">Mesajlar yükleniyor…</p><section id="conversation" aria-label="Mesajlar" aria-live="polite"></section>
<form id="composer"><label for="messageText">Mesajın</label><textarea id="messageText" maxlength="2000" rows="3" placeholder="Eşine bir şeyler yaz…"></textarea><div id="emojiPicker" class="tools" aria-label="Emojiler"><button type="button">❤️</button><button type="button">😘</button><button type="button">🥰</button><button type="button">🫂</button><button type="button">🌸</button><button type="button">✨</button></div>
<div class="tools"><label class="file-button">Fotoğraf / GIF<input id="attachment" type="file" accept="image/jpeg,image/png,image/webp,image/gif"></label><label class="file-button">Fotoğraf çek<input id="camera" type="file" accept="image/*" capture="environment"></label><button type="button" id="openDrawing">Çizim yap</button></div><p class="hint">Fotoğraflar küçültülür. GIF dosyası en fazla 512 KB olabilir.</p><div id="mediaPreview" hidden><img id="previewImage" alt="Gönderilecek görsel"><button type="button" id="removeMedia">Görseli kaldır</button></div>
<section id="drawingArea" hidden aria-label="Çizim alanı"><div class="tools"><label>Renk <input id="penColor" type="color" value="#d86970"></label><label>Kalınlık <input id="penWidth" type="range" min="2" max="20" value="5"></label><button type="button" id="clearDrawing">Temizle</button></div><canvas id="drawing" width="800" height="500" aria-label="Parmağınla veya fareyle çiz"></canvas><div class="tools"><button type="button" id="attachDrawing">Çizimi ekle</button><button type="button" id="cancelDrawing">Vazgeç</button></div></section>
<button id="sendMessage" type="submit">Gönder</button></form></main></body></html>
